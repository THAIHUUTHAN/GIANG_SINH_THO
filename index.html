<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gửi Thỏ iu 🎁</title>
  <meta name="description" content="Một món quà Giáng sinh nhỏ từ Cún gửi Thỏ iu.">
  <meta property="og:title" content="Gửi đến Thỏ iu của Cún 🎁">
  <meta property="og:description" content="Mở hộp quà Giáng sinh nhé!">
  <meta name="theme-color" content="#05070d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202611131616">
</head>
<body class="locked">
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- ================= 1. MÀN HÌNH HỘP QUÀ ================= -->
  <section id="intro" class="intro">
    <div class="bunnies" id="bunnies" aria-hidden="true"></div>
    <div class="intro-inner">

      <button id="gift" class="gift" type="button" aria-label="Mở hộp quà">
        <span class="gift-glow" aria-hidden="true"></span>
        <pre class="gift-lid" aria-hidden="true"></pre>
        <pre class="gift-body" aria-hidden="true"></pre>
      </button>

      <h1 class="intro-msg"><span id="introText"></span><span class="cursor" aria-hidden="true"></span></h1>
      <p class="intro-hint">[ chạm vào hộp quà để mở ]</p>
    </div>
  </section>

  <!-- ================= 2. THIỆP ================= -->
  <main id="card" class="card" hidden>
    <section class="hero" id="hero">
      <!-- 2/3 trái: cây thông code -->
      <div class="win win-tree">
        <div class="win-bar">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div class="tree-stage" id="treeStage">
          <canvas id="tree" aria-label="Cây thông Giáng sinh vẽ bằng ký tự"></canvas>
        </div>
      </div>

      <!-- 1/3 phải: lời chúc -->
      <div class="win win-wish">
        <div class="win-bar">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div class="wish-body" id="wishBody">
          <p class="wish-text"><span id="wishText"></span><span class="cursor" id="wishCursor" aria-hidden="true"></span></p>
          <p class="wish-eof" id="wishEof"><span class="scroll-hint">▼ kỷ niệm của chúng mình ở bên dưới</span></p>
        </div>
      </div>
    </section>

    <!-- ================= 3. ẢNH KỶ NIỆM ================= -->
    <section class="gallery" id="gallery">
      <header class="gallery-head">
        <h2>Những kỷ niệm của chúng mình</h2>
      </header>
      <div class="timeline" id="memories"></div>

      <footer class="ending" id="ending">
        <pre class="end-heart" aria-hidden="true"> .:::.   .:::.
:::::::.:::::::
:::::::::::::::
':::::::::::::'
  ':::::::::'
    ':::::'
      ':'      </pre>
        <p class="end-title" id="endTitle"></p>
        <p class="end-msg" id="endMsg"></p>
        <p class="end-sign" id="endSign"></p>
        <button class="replay" id="replay" type="button">[ ↺ xem lại từ đầu ]</button>
      </footer>
    </section>
  </main>

  <button id="musicBtn" class="music-btn" type="button" hidden>♪ nhạc: bật</button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <script src="js/config.js?v=202611131616"></script>
  <script src="js/sky.js?v=202611131616"></script>
  <script src="js/tree.js?v=202611131616"></script>
  <script src="js/fx.js?v=202611131616"></script>
  <script src="js/bunnies.js?v=202611131616"></script>
  <script src="js/main.js?v=202611131616"></script>
</body>
</html>
